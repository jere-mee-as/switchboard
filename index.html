<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Switchboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,400..700&family=Nunito:wght@400..800&display=swap">
<style>
/* Layout: a rail of spaces and a channel list sit underneath; the conversation slides over them from the right,
   and the people drawer waits under the conversation on the right. Tabs and the now-playing strip sit at the bottom. */
:root{
  --rail:#0f0e0d; --list:#171614; --chat:#1c1a18; --raise:#252320; --field:#2d2a27; --line:#34302c;
  --ink:#efe9e0; --ink-2:#bab2a7; --ink-3:#877f75;
  --brass:#e2a63b; --brass-ink:#1c1406; --lamp:#ffc04d; --lamp-glow:rgba(255,192,77,.55);
  --call:#e4473c; --call-ink:#ffffff; --live:#3cc79b;
  --link:#f1b955; --scrim:rgba(0,0,0,.56); --sel:rgba(226,166,59,.15); --hover:rgba(255,255,255,.04);
  --av1:#d08a4c; --av2:#7aa3d6; --av3:#8fc07c; --av4:#c985b5; --av5:#d6b55d; --av6:#6cc2b6; --av7:#b9906d; --av8:#9e93da; --av-ink:#16130f;
  --font-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tab-h:60px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --rail:#e2e0db; --list:#efeeea; --chat:#f9f8f5; --raise:#ffffff; --field:#e7e5e0; --line:#d9d6d0;
    --ink:#1c1b19; --ink-2:#4e4a45; --ink-3:#7a756e;
    --lamp:#d98f12; --lamp-glow:rgba(217,143,18,.35);
    --call:#d6392f; --live:#1d9a73; --link:#965c00;
    --scrim:rgba(24,20,16,.38); --sel:rgba(226,166,59,.22); --hover:rgba(0,0,0,.035);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --rail:#e2e0db; --list:#efeeea; --chat:#f9f8f5; --raise:#ffffff; --field:#e7e5e0; --line:#d9d6d0;
  --ink:#1c1b19; --ink-2:#4e4a45; --ink-3:#7a756e;
  --lamp:#d98f12; --lamp-glow:rgba(217,143,18,.35);
  --call:#d6392f; --live:#1d9a73; --link:#965c00;
  --scrim:rgba(24,20,16,.38); --sel:rgba(226,166,59,.22); --hover:rgba(0,0,0,.035);
  color-scheme:light;
}
/* In-app appearance setting (overrides the system when not "auto") */
.app[data-skin="dark"]{
  --rail:#0f0e0d; --list:#171614; --chat:#1c1a18; --raise:#252320; --field:#2d2a27; --line:#34302c;
  --ink:#efe9e0; --ink-2:#bab2a7; --ink-3:#877f75;
  --lamp:#ffc04d; --lamp-glow:rgba(255,192,77,.55);
  --call:#e4473c; --live:#3cc79b; --link:#f1b955;
  --scrim:rgba(0,0,0,.56); --sel:rgba(226,166,59,.15); --hover:rgba(255,255,255,.04);
  color-scheme:dark;
}
.app[data-skin="black"]{
  --rail:#000000; --list:#060606; --chat:#000000; --raise:#131312; --field:#191917; --line:#232220;
  --ink:#efe9e0; --ink-2:#b3aba0; --ink-3:#7d766c;
  --lamp:#ffc04d; --lamp-glow:rgba(255,192,77,.55);
  --call:#e4473c; --live:#3cc79b; --link:#f1b955;
  --scrim:rgba(0,0,0,.7); --sel:rgba(226,166,59,.15); --hover:rgba(255,255,255,.04);
  color-scheme:dark;
}
.app[data-skin="light"]{
  --rail:#e2e0db; --list:#efeeea; --chat:#f9f8f5; --raise:#ffffff; --field:#e7e5e0; --line:#d9d6d0;
  --ink:#1c1b19; --ink-2:#4e4a45; --ink-3:#7a756e;
  --lamp:#d98f12; --lamp-glow:rgba(217,143,18,.35);
  --call:#d6392f; --live:#1d9a73; --link:#965c00;
  --scrim:rgba(24,20,16,.38); --sel:rgba(226,166,59,.22); --hover:rgba(0,0,0,.035);
  color-scheme:light;
}

html{height:100%;box-sizing:border-box;background:var(--rail)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--rail);color:var(--ink);font:15px/1.4 var(--font-ui);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:18px;height:18px}
.i.xs{width:15px;height:15px}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;
  background:var(--list);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  border-inline:1px solid var(--line)}
@media (max-width:540px){.app{border-inline:0}}
.app textarea,.app input{user-select:text;-webkit-user-select:text}

/* ---------- views ---------- */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}
.v-home{flex-direction:row}
.page{flex-direction:column;background:var(--list);overflow-y:auto;overscroll-behavior:contain}
.page>*{flex:none}

/* ---------- rail ---------- */
.rail{width:72px;flex:none;background:var(--rail);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 18px}
.rail::-webkit-scrollbar{display:none}
.rail hr{width:30px;height:2px;border:0;border-radius:1px;background:var(--line);margin:0;flex:none}
.tile{position:relative;flex:none;width:48px;height:48px;border-radius:15px;background:var(--raise);
  display:grid;place-items:center;color:var(--ink-2);transition:background .15s}
.tile.on{background:var(--field);color:var(--ink);box-shadow:0 0 0 2px var(--rail),0 0 0 4px var(--brass)}
.tile.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--ink-3)}
.tile.ghost.on{border-style:solid;border-color:var(--brass);box-shadow:none;color:var(--ink)}
.tile.home{background:var(--brass);color:var(--brass-ink)}
.tile.home.on{box-shadow:0 0 0 2px var(--rail),0 0 0 4px var(--ink)}
.tile .glyph{font:650 16px/1 var(--font-ui);letter-spacing:-.01em}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:32px;height:32px}
.mosaic img{width:14.5px;height:14.5px;object-fit:cover;border-radius:4px;display:block}
.lamp{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--lamp);
  box-shadow:0 0 0 3px var(--rail),0 0 9px 1px var(--lamp-glow)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--call);color:var(--call-ink);font:700 11.5px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.tile .count{position:absolute;right:-5px;bottom:-5px;box-shadow:0 0 0 3px var(--rail)}

/* ---------- channel list ---------- */
.chanlist{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--list);position:relative}
.space-head{display:flex;align-items:center;gap:6px;padding:14px 8px 10px 16px;flex:none}
.space-head .st{flex:1;min-width:0}
.space-head h1{margin:0;font:650 19px/1.2 var(--font-ui);font-stretch:92%;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.space-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-ex{display:inline-block;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;
  padding:3px 6px;border-radius:5px;background:var(--field);color:var(--ink-2);vertical-align:1px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none;position:relative}
.icon-btn:active{background:var(--hover)}
.searchbar{margin:0 12px 6px;height:38px;border-radius:11px;background:var(--rail);display:flex;align-items:center;gap:8px;
  padding:0 12px;color:var(--ink-3);font-size:14px;flex:none}
.chan-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 20px}
.cat{display:flex;align-items:center;gap:4px;width:100%;padding:16px 8px 6px;font:700 11.5px/1 var(--font-ui);
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.cat .i{width:14px;height:14px;transition:transform .15s}
.cat.shut .i{transform:rotate(-90deg)}
.cat .n{margin-left:auto;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.chan{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 10px;border-radius:10px;color:var(--ink-3);
  font-size:15.5px;font-weight:500}
.chan:active,.chan.on{background:var(--raise);color:var(--ink)}
.chan.unread{color:var(--ink);font-weight:650}
.chan .cl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .hash{width:24px;display:grid;place-items:center;color:var(--ink-3)}
.chan img.ai{width:24px;height:24px;flex:none;display:block}
.dotlamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp-glow);flex:none}
.chan .dotlamp{margin-right:4px}
.av .st.dnd{background:var(--call)}
.av .st.inv{background:var(--ink-3)}
.chan .muted{color:var(--ink-3)}
.chan.add{color:var(--ink-3);font-size:14.5px}
.chan.add .hash{color:var(--ink-3)}
.event-row{margin-top:2px}
.event-row .pill{font:600 12px/1 var(--font-ui);color:var(--ink-2);background:var(--field);border-radius:8px;padding:4px 7px}
.live-wrap{margin-top:2px}
.live-user{display:flex;align-items:center;gap:10px;padding:4px 10px 6px 45px;color:var(--ink-2);font-size:13.5px;min-width:0}
.live-user .art{width:22px;height:22px;border-radius:6px;flex:none;background:linear-gradient(135deg,var(--brass),var(--av4))}
.live-user .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.eq i{width:3px;background:var(--live);border-radius:1px;height:4px;animation:eq 1s steps(5) infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.eq.paused i{animation:none;height:3px;background:var(--ink-3)}
@keyframes eq{0%{height:3px}25%{height:11px}50%{height:6px}75%{height:12px}100%{height:3px}}
.empty-note{padding:14px 12px;color:var(--ink-3);font-size:13.5px;line-height:1.45}

/* ---------- now playing + tabs ---------- */
.nowbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;background:var(--raise);border-top:1px solid var(--line);min-width:0}
.nowbar .art{width:38px;height:38px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--brass),var(--av4));display:grid;place-items:center;color:var(--brass-ink)}
.nowbar .art img{width:100%;height:100%;border-radius:9px;object-fit:cover}
.nowbar .meta{flex:1;min-width:0}
.nowbar .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .s{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.nowbar .s .on-air{color:var(--live);font-weight:600}
.nowbar .icon-btn{width:38px;height:38px;color:var(--ink)}
.tabs{flex:none;display:flex;height:var(--tab-h);background:var(--rail);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font:600 11px/1 var(--font-ui);position:relative}
.tab.on{color:var(--ink)}
.tab .ti{position:relative;display:grid}
.tab .count{position:absolute;left:14px;top:-6px;box-shadow:0 0 0 3px var(--rail);min-width:18px;height:18px;font-size:10.5px}
.tab .lamp{right:-5px;top:-3px}
.tab .me-av{width:24px;height:24px;font-size:11px}
.tab .me-av .st{width:10px;height:10px;border-width:2px;border-color:var(--rail);right:-3px;bottom:-3px}

/* ---------- avatars ---------- */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:650 15px/1 var(--font-ui);color:var(--av-ink);position:relative}
.av.app{border-radius:0;background:none}
.av.app img{width:100%;height:100%;display:block}
.av.op{background:var(--brass);color:var(--brass-ink)}
.av.me{background:var(--ink);color:var(--list)}
.av .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--list);background:var(--live)}
.av .badge-app{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:6px;box-shadow:0 0 0 2.5px var(--list);overflow:hidden}
.av .badge-app img{width:100%;height:100%;display:block}
.c1{background:var(--av1)}.c2{background:var(--av2)}.c3{background:var(--av3)}.c4{background:var(--av4)}
.c5{background:var(--av5)}.c6{background:var(--av6)}.c7{background:var(--av7)}.c8{background:var(--av8)}

/* ---------- chat ---------- */
.people{position:absolute;top:0;bottom:0;right:0;width:84%;z-index:15;background:var(--list);display:flex;flex-direction:column;visibility:hidden}
.people.show{visibility:visible}
.chat{position:absolute;inset:0;z-index:20;background:var(--chat);display:flex;flex-direction:column;
  transform:translate3d(100%,0,0);transition:transform .28s var(--ease);touch-action:pan-y;will-change:transform;
  box-shadow:-1px 0 0 var(--line)}
.chat.at-chat{transform:none}
.chat.at-people{transform:translate3d(-84%,0,0)}
.chat.drag{transition:none}
.chat-head{flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--line)}
.chat-head .ct{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.chat-head .ct .hash{color:var(--ink-3)}
.chat-head .tt{min-width:0}
.chat-head b{display:block;font-weight:650;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .av{width:32px;height:32px;font-size:13px}
.chat-head .av .badge-app{width:15px;height:15px;border-radius:4px;right:-4px;bottom:-4px;box-shadow:0 0 0 2px var(--chat)}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:0 0 12px;user-select:none}
.msgs-top{margin-top:auto;padding:28px 16px 8px}
.intro-glyph{width:64px;height:64px;border-radius:20px;background:var(--raise);display:grid;place-items:center;color:var(--ink-2);margin-bottom:12px}
.intro-glyph .i{width:34px;height:34px}
.msgs-top h2{margin:0 0 4px;font:650 24px/1.15 var(--font-ui);font-stretch:92%;letter-spacing:-.015em;text-wrap:balance}
.msgs-top p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:42ch;line-height:1.45}
.msgs-top .av{width:64px;height:64px;font-size:24px;margin-bottom:12px}
.divider{display:flex;align-items:center;gap:10px;margin:18px 16px 2px;color:var(--ink-3);font:600 12px/1 var(--font-ui)}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}
.divider.new{color:var(--call);margin-top:10px}
.divider.new::before,.divider.new::after{background:var(--call);opacity:.7}
.msg{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;padding:3px 16px}
.msg.head{margin-top:14px}
.msg:active{background:var(--hover)}
.msg .gt{font:500 10.5px/22px var(--font-ui);color:transparent;text-align:right;font-variant-numeric:tabular-nums}
.msg:active .gt{color:var(--ink-3)}
.who{display:flex;align-items:baseline;gap:7px;min-width:0;margin-bottom:1px}
.who b{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who time{font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font:700 9.5px/1 var(--font-mono);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--field);color:var(--ink-2);align-self:center}
.tag.sys{background:var(--brass);color:var(--brass-ink)}
.tx{font-size:15.5px;line-height:1.42;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ink)}
.tx strong{font-weight:650}
.tx a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.tx code.cmd{font:600 13.5px/1 var(--font-mono);background:var(--sel);color:var(--ink);padding:3px 6px;border-radius:6px}
.tx.faded{color:var(--ink-3)}
.ref{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:2px;min-width:0}
.ref .i{width:14px;height:14px;flex:none}
.ref span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref b{color:var(--ink-2);font-weight:600}
.cleared{font-size:11.5px;color:var(--ink-3)}
.pinmark{color:var(--brass);vertical-align:-3px}
.sysmsg{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;padding:4px 16px;margin-top:6px;align-items:center;color:var(--ink-3);font-size:14px}
.sysmsg .si{display:grid;place-items:center;color:var(--ink-3)}
.sysmsg .si img{width:20px;height:20px}
.sysmsg b{color:var(--ink);font-weight:600}
.sysmsg time{font-size:11.5px;margin-left:6px;font-variant-numeric:tabular-nums}
.embed{margin-top:6px;max-width:440px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 12px 11px;display:grid;gap:3px}
.embed .ek{display:flex;align-items:center;gap:6px;font:700 11px/1.3 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.embed .ek .i{width:15px;height:15px;color:var(--brass)}
.embed .et{font:650 21px/1.2 var(--font-ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.embed .el{font-size:14px;color:var(--ink-2);line-height:1.45}
.embed dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:4px 0 0;font-size:13.5px}
.embed dt{color:var(--ink-3)}
.embed dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cmdlist{display:grid;gap:2px;margin-top:4px}
.cmdrow{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:10px;align-items:baseline;padding:5px 0;text-align:left}
.cmdrow code{font:600 13px/1.3 var(--font-mono);color:var(--ink)}
.cmdrow span{font-size:13px;color:var(--ink-2)}
.cmdhead{font:700 10.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 0 2px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{height:34px;padding:0 13px;border-radius:10px;background:var(--field);color:var(--ink);font:600 13.5px/1 var(--font-ui);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn .i{width:16px;height:16px}
.btn.pri{background:var(--brass);color:var(--brass-ink)}
.btn.danger{color:var(--call)}
.btn:active{filter:brightness(1.12)}
.msg .btn{height:30px;padding:0 11px;font-size:13px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.msg .btnrow{gap:6px;margin-top:6px}
.msg .btn.pri{background:var(--brass);color:var(--brass-ink);box-shadow:none}
.btn.wide{width:100%;justify-content:center;height:44px;font-size:14.5px;border-radius:12px}

/* reply + composer */
.replybar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;background:var(--raise);border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);min-width:0}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar b{color:var(--ink)}
.replybar .icon-btn{width:30px;height:30px}
.composer{flex:none;position:relative;display:flex;align-items:flex-end;gap:8px;padding:8px 10px 10px;background:var(--chat)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--field);color:var(--ink-2)}
.round.send{background:var(--field);color:var(--ink-3);transition:background .12s,color .12s}
.round.send.ready{background:var(--brass);color:var(--brass-ink)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--field);border-radius:21px;padding:0 4px 0 15px;min-height:42px}
.field textarea{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:16px/1.35 var(--font-ui);resize:none;
  padding:10px 0;max-height:132px;height:41px}
.field textarea::placeholder{color:var(--ink-3)}
.slash{width:34px;height:34px;margin:4px 0;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);font:600 17px/1 var(--font-mono)}
.slash.on{color:var(--brass)}
.picker{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);max-height:min(52vh,360px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.ph{font:700 10.5px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 6px}
.opt{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:11px;min-height:46px}
.opt.sel{background:var(--sel)}
.opt .oi{width:28px;height:28px;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.opt .oi img{width:28px;height:28px;display:block}
.opt .oi .av{width:28px;height:28px;font-size:12px}
.opt .ot{flex:1;min-width:0}
.opt .k{display:block;font:600 14px/1.3 var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .k.sans{font-family:var(--font-ui);font-size:15px}
.opt .k em{font-style:normal;color:var(--ink-3);font-weight:400}
.opt .d{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ret{font:600 10.5px/1 var(--font-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:3px 5px}

/* people drawer */
.people-head{flex:none;height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-weight:650;font-size:16.5px;gap:8px}
.people-scroll{flex:1;overflow-y:auto;padding:4px 8px 20px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px;border-radius:10px;min-height:52px}
.mrow:active{background:var(--raise)}
.mrow .av{width:36px;height:36px;font-size:13px}
.mrow .mt{flex:1;min-width:0}
.mrow b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow small{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.quiet{opacity:.55}
.mrow .count{flex:none}

/* ---------- pages: inbox / activity / you ---------- */
.page-head{position:sticky;top:0;z-index:2;background:var(--list);display:flex;align-items:center;gap:4px;padding:14px 8px 8px 16px}
.page-head h1{flex:1;margin:0;font:650 24px/1.2 var(--font-ui);font-stretch:92%;letter-spacing:-.015em}
.favs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 14px;flex:none}
.favs::-webkit-scrollbar{display:none}
.fav{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.fav .av{width:54px;height:54px;font-size:19px}
.fav span{max-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect{font:700 11.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:18px 16px 8px;display:flex;align-items:center;gap:8px}
.sect .n{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums}
.convo{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 16px;min-height:68px}
.convo:active{background:var(--raise)}
.convo .av{width:48px;height:48px;font-size:17px}
.convo .ct{min-width:0}
.convo .n{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .p{display:block;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo.unread .p{color:var(--ink);font-weight:550}
.convo .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.convo.unread .meta time{color:var(--ink)}
.card{margin:6px 12px;background:var(--raise);border-radius:16px;padding:14px;display:grid;gap:10px}
.card p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.45}
.card b{font-weight:650}
.agenda-day{font:600 13px/1 var(--font-ui);color:var(--ink-2);padding:14px 16px 6px}
.ev{display:grid;grid-template-columns:74px 3px minmax(0,1fr);gap:12px;align-items:stretch;width:100%;padding:7px 16px;min-height:52px}
.ev:active{background:var(--raise)}
.ev .when{white-space:nowrap;font:600 13px/1.25 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--ink);padding-top:2px}
.ev .when small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.ev .bar{border-radius:2px}
.ev .et{min-width:0}
.ev b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.now .when{color:var(--brass)}
.nrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;width:100%;padding:10px 16px;align-items:start}
.nrow:active{background:var(--raise)}
.nrow img{width:36px;height:36px;display:block}
.nrow .nt{min-width:0}
.nrow b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.nrow .np{font-size:13.5px;color:var(--ink-2);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nrow .nm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nrow.old{opacity:.6}
.nrow .src{font-size:12px;color:var(--ink-3)}

.banner{height:118px;flex:none;position:relative;
  background-color:var(--bn,var(--brass));
  background-image:radial-gradient(circle at center, var(--rail) 0 3px, transparent 3.6px),
    radial-gradient(circle at center, rgba(0,0,0,.12) 0 6px, transparent 6.5px);
  background-size:24px 24px,24px 24px;background-position:12px 12px,12px 12px}
.banner .icon-btn{position:absolute;right:max(8px, env(safe-area-inset-right,0px));top:8px;background:var(--scrim);color:#fff}
.me-block{padding:0 16px 4px;margin-top:-44px;position:relative;display:grid;gap:10px}
.me-block .av{width:88px;height:88px;font-size:34px;box-shadow:0 0 0 6px var(--list)}
.me-block .av .st{width:24px;height:24px;border-width:5px;right:0;bottom:0}
.me-block h2{margin:0;font:650 24px/1.15 var(--font-ui);font-stretch:92%;letter-spacing:-.015em}
.me-block .note{color:var(--ink-2);font-size:14.5px;margin-top:2px}
.me-btns{display:flex;gap:8px}
.me-btns .btn{flex:1;justify-content:center;height:40px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin:6px 12px}
.stat{background:var(--raise);padding:12px 14px;display:grid;gap:3px;min-width:0}
.stat small{font:700 10.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stat b{font:650 20px/1.15 var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:var(--field);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--live);border-radius:3px}
.meter.low i{background:var(--call)}
.group{margin:6px 12px 10px;background:var(--raise);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;min-height:52px;padding:8px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--hover)}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-weight:550;font-size:15px}
.row small{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.row .rv{font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.row .i{color:var(--ink-2)}
.row.danger,.row.danger .i{color:var(--call)}
.row img{width:30px;height:30px}
.ok{color:var(--live);font-weight:600;font-size:13px}
.foot{padding:18px 16px 28px;color:var(--ink-3);font-size:12.5px;display:flex;align-items:center;gap:8px}
.foot code{font-family:var(--font-mono)}

/* ---------- overlay pages ---------- */
.overlay{position:absolute;inset:0;z-index:30;background:var(--list);display:flex;flex-direction:column}
.ov-head{flex:none;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px;border-bottom:1px solid var(--line)}
.ov-head h2{flex:1;margin:0;font:650 17px/1 var(--font-ui)}
.ov-head input{flex:1;min-width:0;height:40px;border:0;outline:0;border-radius:11px;background:var(--field);color:var(--ink);font:16px var(--font-ui);padding:0 12px}
.ov-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 24px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--field);border-radius:12px;padding:4px;margin:4px 12px 4px}
.seg button{height:36px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--raise);color:var(--ink)}
.label{font:700 11.5px/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:18px 16px 8px}
.inp{display:block;width:calc(100% - 24px);margin:0 12px;height:46px;border:1px solid var(--line);outline:0;border-radius:12px;background:var(--raise);color:var(--ink);font:16px var(--font-ui);padding:0 14px}
.inp:focus{border-color:var(--brass)}
.swatches{display:flex;gap:12px;padding:4px 16px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{box-shadow:0 0 0 2px var(--list),0 0 0 4px var(--ink)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.check .i{width:16px;height:16px;stroke-width:2.6}
.row .check:not(.on) .i{color:transparent}
.row .check.on .i{color:var(--brass-ink)}
.check{transition:background .15s,border-color .15s}
.check.on .i{animation:tick .35s var(--spring)}
@keyframes tick{from{transform:scale(.3)}}

/* ---------- sheet, scrim, toast ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:88%;display:flex;flex-direction:column;background:var(--list);
  border-radius:20px 20px 0 0;transform:translate3d(0,105%,0);transition:transform .26s var(--ease);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{flex:none;height:22px;display:grid;place-items:center;width:100%}
.grab::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 0 16px}
.sh-head{display:flex;align-items:center;gap:14px;padding:4px 18px 14px}
.sh-head img,.sh-head .av{width:52px;height:52px;flex:none}
.sh-head .av{font-size:19px}
.sh-head .tile{flex:none}
.sh-head .tile img{width:30px;height:30px}
.sh-head .tt{min-width:0;flex:1}
.sh-head b{display:block;font:650 19px/1.2 var(--font-ui);font-stretch:94%;overflow-wrap:anywhere}
.sh-head small{display:block;color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 6px}
.qa button{background:var(--raise);border-radius:14px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 2px;text-align:center}
.qa button .i{color:var(--ink)}
.qa button.on{background:var(--brass);color:var(--brass-ink)}
.qa button.on .i{color:var(--brass-ink)}
.toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + 22px);z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);background:var(--ink);color:var(--list);font-weight:600;font-size:13.5px;padding:10px 14px;border-radius:12px;
  transition:opacity .18s,transform .18s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.app[data-density="compact"] .chan{min-height:36px;font-size:15px}
.app[data-density="compact"] .msg.head{margin-top:8px}
.app[data-density="compact"] .tx{font-size:15px}
.app[data-density="compact"] .convo{min-height:58px;padding-block:6px}
.app[data-density="compact"] .convo .av{width:40px;height:40px}

@media (prefers-reduced-motion: reduce){
  .chat,.sheet,.scrim,.toast,.tile,.cat .i{transition-duration:.01s!important}
  .eq i{animation:none;height:6px}
}

/* ---------- v0.2 ---------- */
:root{--qr-bg:#ffffff}
/* the bar into #feed, at the top of every list */
.doorway{margin:0 12px 6px;height:42px;border-radius:21px;background:var(--field);display:flex;align-items:center;gap:9px;
  padding:0 6px 0 14px;color:var(--ink-3);font-size:15px;flex:none;text-align:left;width:calc(100% - 24px)}
.doorway .dl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doorway .dk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:600 16px/1 var(--font-mono);color:var(--ink-3)}
.doorway:active{filter:brightness(1.1)}
/* up next */
.evdot{width:24px;display:grid;place-items:center;flex:none}
.evdot i{width:10px;height:10px;border-radius:3px;display:block}
.evw{font-size:13px;color:var(--ink-3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.chan.unread .evw{color:var(--brass);font-weight:650}
/* pull up for all apps */
.pullhint{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;padding:16px 0 8px;
  color:var(--ink-3);font:600 12px/1 var(--font-ui);letter-spacing:.04em}
.pullhint .i{transition:transform .15s var(--ease)}
.chanlist.pulling .pullhint{color:var(--brass)}
.chanlist.pulling .pullhint .i{transform:translateY(-4px)}
.chanlist{touch-action:pan-y}
/* rail options */
.app[data-rail="right"] .v-home{flex-direction:row-reverse}
.rail.from-bottom>:first-child{margin-top:auto}
/* passport */
.me-block{padding-bottom:6px}
.passport{margin:6px 12px 10px;background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;display:grid;gap:10px}
.pp-head{display:flex;align-items:center;gap:8px;min-height:34px}
.pp-k{font:700 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.pp-head .icon-btn{margin-left:auto;width:34px;height:34px}
.pp-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.pp-rows{display:grid;gap:0;min-width:0}
.pp-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;text-align:left;min-width:0}
.pp-row>.i{color:var(--ink-3)}
.pp-row>span{min-width:0;font-size:14.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-row small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.pp-qr{width:116px;height:116px;border-radius:12px;background:var(--qr-bg);padding:4px;display:block;flex:none}
.pp-qr svg,.qr-big svg{display:block;width:100%;height:100%}
.pp-foot{font-size:12px;color:var(--ink-3)}
.qr-big{width:min(78vw,300px);aspect-ratio:1;max-width:calc(100% - 24px);margin:4px auto 14px;background:var(--qr-bg);border-radius:16px;padding:10px}
@media (max-width:360px){.pp-body{grid-template-columns:1fr}.pp-qr{justify-self:start}}
.switch{width:46px;height:28px;border-radius:14px;background:var(--field);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.switch.on{background:var(--brass)}
.switch.on::after{transform:translateX(18px);background:var(--brass-ink)}
.linkrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:8px;padding:0 12px;margin-bottom:8px}
.linkrow .inp{width:100%;margin:0}
.icon-btn.on{background:var(--sel);color:var(--ink)}
.convo.sel{background:var(--raise)}
/* unfolded: rail + list | conversation | optional drawer */
.app.wide{max-width:none;border-inline:0;display:grid;grid-template-columns:380px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto auto}
.app.wide>.views{grid-column:1;grid-row:1;min-height:0;border-right:1px solid var(--line)}
.app.wide>.nowbar{grid-column:1;grid-row:2;border-right:1px solid var(--line)}
.app.wide>.tabs{grid-column:1;grid-row:3;border-right:1px solid var(--line)}
.app.wide>.chat{position:relative;inset:auto;grid-column:2;grid-row:1/4;transform:none!important;transition:none;box-shadow:none;min-width:0;min-height:0}
.app.wide>.people{position:relative;grid-column:3;grid-row:1/4;width:300px;display:none;visibility:visible;border-left:1px solid var(--line);min-height:0}
.app.wide>.people.show{display:flex}
.app.wide [data-act="to-list"]{display:none}
.app.wide .chat-head{padding-left:14px}
.app.wide>.overlay{inset:0 auto 0 0;width:380px;border-right:1px solid var(--line)}
.app.wide .sheet{left:50%;right:auto;width:min(560px,100%);transform:translate3d(-50%,105%,0)}
.app.wide .sheet.on{transform:translate3d(-50%,0,0)}
.app.wide .toast{bottom:28px}
.app.wide .msgs-top,.app.wide .msg,.app.wide .sysmsg,.app.wide .divider{max-width:860px}

/* ---------- v0.3: fun stuff ---------- */
.app{font-family:var(--font-ui);--wall-ink:color-mix(in srgb,var(--ink) 8%,transparent)}
.app[data-font="mono"]{--font-ui:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace}
.app[data-font="serif"]{--font-ui:"Fraunces", Georgia, "Times New Roman", serif}
.app[data-font="rounded"]{--font-ui:"Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif}
/* wallpapers */
.wsw[data-w="none"]{--wall:none}
.app[data-wall="dots"],.wsw[data-w="dots"]{--wall:radial-gradient(circle,var(--wall-ink) 1.3px,transparent 1.9px);--wall-size:18px 18px}
.app[data-wall="grid"],.wsw[data-w="grid"]{--wall:linear-gradient(var(--wall-ink) 1px,transparent 1px),linear-gradient(90deg,var(--wall-ink) 1px,transparent 1px);--wall-size:22px 22px}

/* Small QR encoder for the passport card: byte mode, error correction level M, versions 1-40.
   Works offline, so the launcher never needs a network library for it. */
const SBQR = (() => {
  'use strict';
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  function gmul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z;
  }
  function rsDivisor(deg) {
    const r = new Array(deg - 1).fill(0).concat([1]);
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) { r[j] = gmul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
      root = gmul(root, 0x02);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gmul(c, f); }); }
    return r;
  }
  function alignPositions(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2;
    const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const out = [6];
    for (let p = v * 4 + 10; out.length < n; p -= step) out.splice(1, 0, p);
    return out;
  }
  function penalty(m) {
    const n = m.length; let p = 0, dark = 0;
    for (let y = 0; y < n; y++) {
      let runR = 1, runC = 1;
      for (let x = 0; x < n; x++) {
        if (m[y][x]) dark++;
        if (x > 0) {
          if (m[y][x] === m[y][x - 1]) { runR++; p += runR === 5 ? 3 : runR > 5 ? 1 : 0; } else runR = 1;
          if (m[x][y] === m[x - 1][y]) { runC++; p += runC === 5 ? 3 : runC > 5 ? 1 : 0; } else runC = 1;
        }

    const count = s => { let c = 0, i = -1; while ((i = s.indexOf('00001011101', i + 1)) !== -1) c++; i = -1; while ((i = s.indexOf('10111010000', i + 1)) !== -1) c++; return c; };
    for (let a = 0; a < n; a++) {
      let r = '0000', c = '0000';
      for (let b = 0; b < n; b++) { r += m[a][b] ? '1' : '0'; c += m[b][a] ? '1' : '0'; }
      p += 40 * (count(r + '0000') + count(c + '0000'));
    }
    const k = Math.ceil(Math.abs(dark * 20 - n * n * 10) / (n * n)) - 1;
    return p + Math.max(0, k) * 10;
  }
  function matrix(text) {
    const bytes = Array.from(new TextEncoder().encode(String(text)));
    let v = 1;
    for (; v <= 40; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCodewords(v) * 8) break;
    if (v > 40) return null;
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(v) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

    const nb = BLK[v], ecl = ECC[v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDivisor(ecl), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1));

      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);

    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - ecl || j >= nShort) cw.push(b[i]); });

    const size = v * 4 + 17;

    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };

    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignPositions(v), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = (m, mask) => {
      const d = (0 << 3) | mask; let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
      const s = (x, y, val) => { m[y][x] = val; fn[y][x] = true; };
      for (let i = 0; i <= 5; i++) s(8, i, bit(i));
      s(8, 7, bit(6)); s(8, 8, bit(7)); s(7, 8, bit(8));
      for (let i = 9; i < 15; i++) s(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) s(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) s(8, size - 15 + i, bit(i));
      s(8, size - 8, true);
    };
    drawFormat(mod, 0);
    if (v >= 7) {
      let rem = v;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (v << 12) | rem;
      for (let i = 0; i < 18; i++) { const d = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, d); set(c, a, d); }
    }
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < cw.length * 8) { mod[y][x] = ((cw[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
      }
    }
    const masks = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0
    ];
    let best = null, bestP = Infinity;
    for (let k = 0; k < 8; k++) {
      const m = mod.map((row, y) => row.map((d, x) => (fn[y][x] ? d : d !== masks[k](x, y))));
      drawFormat(m, k);
      const p = penalty(m);
      if (p < bestP) { bestP = p; best = m; }

  }

    const m = matrix(text);
    if (!m) return '';

    return `<svg viewBox="-4 -4 ${n + 8} ${n + 8}" shape-rendering="crispEdges" role="img" aria-label="Contact code"><rect x="-4" y="-4" width="${n + 8}" height="${n + 8}" fill="#ffffff"/><path d="${d}" fill="#111111"/></svg>`;
  }

})();

<script>
/* Switchboard v0.4: an Android home screen laid out as a chat app.
   v0.4: pull past the top of any list for #feed (the shade moved to the rail), pull past the newest message to go back,
   A–Z lines and fast scroll, hold-and-drag spaces, search in the app picker, auto-named spaces, typed passport links
   with a code per link, You as a pop-up profile card, press highlights and motion throughout.
   Home: the bar into #feed, the next three events, pinned apps. Spaces on the rail hold apps as channels.
   #feed is where you talk to the phone (commands, Operator). Messages is people. Activity is everything else.

   PHONE BRIDGE (window.SBNative, injected by the Kotlin shell; methods return a JSON string or a primitive)
     apps()                     [{key, pkg, label, cat, icon}]   icon = unmasked square PNG data URI; the launcher applies the shape   cat = ApplicationInfo category: audio|video|image|social|productivity|game|news|maps|other
     launch(key) / appInfo(pkg) / uninstall(pkg)
     notifs()                   [{id, pkg, kind: msg|call|email|other, title, text, person, convo, group, time, live, canReply, actions:[title]}]
                                recent history (about 48 h, newest 300); live = still in the shade; skip the user's own messages
     notifOpen(id) / notifDismiss(id) / dismissAll() / notifReply(id, text) -> bool / notifAction(id, index)
     media()                    {pkg, title, artist, playing, art} | null       mediaCmd(play|pause|toggle|next|prev)
     events(days)               [{id, title, start, end, allDay, loc, color}]   openEvent(id) / newEvent(title, startMs, endMs, allDay)
     contacts()                 starred contacts [{id, name, phone}]            call(number) / sms(number, body) / openContact(id)
     profile()                  owner card from ContactsContract.Profile {name, phone, email} (first run only)
     battery() {pct, charging}  device() {model, android, free, total}
     perms() {notif, calendar, contacts, dnd, phone, alarms, isHome}            askPerm(name) / setHome()
     setDnd(on) -> bool  torch(on) -> bool  timer(seconds, label)  alarm(hour, minute, label)
     remind(id, atMs, text) / cancelRemind(id)     exact alarm that posts a notification and calls SB.onNative('remind', id)
     web(query) / url(href) / maps(query) / settings(panel) / shade() / copy(text) / haptic(kind) / version()
   NATIVE -> PAGE: window.SB.onNative(type, json)   types: back, home, resume, apps, notifs, media, battery, perms, events, remind
   The Activity must declare configChanges for screenSize|smallestScreenSize|screenLayout|orientation so the WebView survives fold/unfold.
*/
(() => {
  'use strict';

  /* ---------- utilities ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const initials = s => {
    const str = String(s || '');

    const w = str.replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);

  };

  /* ---------- A–Z fast scroll ---------- */
  function mountAZ(host, sc, mark = host) {
    const seps = [...sc.querySelectorAll('.lsep')];
    if (seps.length < 5) return;
    mark.classList.add('has-az');
    const az = document.createElement('div'), bub = document.createElement('div');
    az.className = 'az'; az.setAttribute('aria-hidden', 'true');
    az.innerHTML = seps.map(s => `<b>${esc(s.dataset.l)}</b>`).join('');
    bub.className = 'az-bubble'; bub.innerHTML = '<span></span>';
    host.append(az, bub);
    const bs = [...az.children];
    let cur = -1;
    const mark1 = (cls, i) => bs.forEach((b, j) => b.classList.toggle(cls, j === i));
    const onScroll = () => {
      if (az.classList.contains('active')) return;
      const y = sc.scrollTop + 12; let i = 0;
      for (let j = 0; j < seps.length; j++) if (seps[j].offsetTop <= y) i = j;
      mark1('cur', i);
    };
    sc.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    const at = y => {
      const r = az.getBoundingClientRect(), hr = host.getBoundingClientRect();
      let i = bs.findIndex(b => { const q = b.getBoundingClientRect(); return y < q.bottom; });
      if (i < 0) i = bs.length - 1;
      if (y < r.top) i = 0;
      if (i !== cur) {
        cur = i;
        sc.scrollTop = Math.max(0, seps[i].offsetTop - 2);
        mark1('on', i); mark1('cur', i);
        bub.firstChild.textContent = seps[i].dataset.l;
        if (B.haptic) B.haptic('tick');
      }
      bub.style.top = Math.max(0, Math.min(hr.height - 58, y - hr.top - 50)) + 'px';
    };
    az.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      try { az.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      S.azBusy = true; cur = -1; az.classList.add('active'); bub.classList.add('on'); at(e.clientY);
    });
    az.addEventListener('pointermove', e => { if (S.azBusy && az.classList.contains('active')) at(e.clientY); });
    const done = () => { if (!az.classList.contains('active')) return; S.azBusy = false; az.classList.remove('active'); bub.classList.remove('on'); mark1('on', -1); };
    az.addEventListener('pointerup', done);
    az.addEventListener('pointercancel', done);
    az.addEventListener('lostpointercapture', done);
  }

  function vcard(p) {
    const e = s => String(s || '').replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n');
    const parts = String(p.name || '').trim().split(/\s+/);
    const L = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + e(p.name),
      'N:' + e(parts.length > 1 ? parts[parts.length - 1] : '') + ';' + e(parts.length > 1 ? parts.slice(0, -1).join(' ') : parts[0] || '') + ';;;'];
    if (p.phone) L.push('TEL;TYPE=CELL:' + String(p.phone).replace(/[^\d+]/g, ''));
    if (p.email) L.push('EMAIL:' + p.email);
    const notes = [];
    for (const l of arr(p.links)) {
      const u = linkUrl(l);
      if (u) L.push('URL:' + u); else if (l.v) notes.push(linkName(l) + ': ' + linkShow(l));
    }

  function parseDur(s) {
    s = norm(s).replace(/\s+/g, '');
    if (!s) return 0;

    if (/^\d+:\d{2}$/.test(s)) { const [m, x] = s.split(':'); return +m * 60 + +x; }

  function parseClock(s) {

  function runMacro(name) {
    if (S.macroDepth > 1) return op('Macros can only call one level deep.');

    sys('bolt', `Running <b>/${esc(name)}</b>`);
    try {
      for (const s of D.macros[name]) {
        if (s.startsWith('/')) runCommand(s);
        else { const a = findApp(s) || findApps(s, 1)[0]; a && score(a.label, s) >= 15 ? launchApp(a, 'cmd') : noApp(s); }

    const c = cmdByName(name);
    if (!c) {

      if (v === 'uninstall') { closeSheet(); return B.uninstall(a.pkg); }
    },
    'move-toggle': t => {
      const s = spaceOf(t.dataset.id), k = t.dataset.key; if (!s) return;
      s.apps = s.apps.includes(k) ? s.apps.filter(x => x !== k) : s.apps.concat(k);
      if (s.auto) s.name = autoName(s);
      save(); t.querySelector('.check').classList.toggle('on'); renderRail(); renderList();
    },
    'pin-toggle': t => {
      const k = t.dataset.key;
      D.pinned = D.pinned.includes(k) ? D.pinned.filter(x => x !== k) : D.pinned.concat(k);
      save(); t.querySelector('.check').classList.toggle('on'); renderList();
    },
    'msg-act': t => {
      const m = S.sheetMsg, v = t.dataset.v; if (!m) return;
      const n = m.n, text = n ? [n.person || n.title, n.text].filter(Boolean).join(': ') : (m.text || '');
      closeSheet();
      if (v === 'reply') return startReply(n.id);
      if (v === 'open') return B.notifOpen(n.id);
      if (v === 'thread') return openChannel('dm:' + convoKey(n));
      if (v === 'action') return B.notifAction(n.id, +t.dataset.i);
      if (v === 'copy') return copy(text);
      if (v === 'note') { addNote(text); return toast('Saved to #notes'); }
      if (v === 'dismiss') return B.notifDismiss(n.id);
      if (v === 'mute') { if (!muted(n.pkg)) D.muted.push(n.pkg); save(); renderAll(); return toast('Badges muted'); }
      if (v === 'pin') { m.note.pin = !m.note.pin; save(); renderMsgs(S.co, true); return renderPeople(S.co); }
      if (v === 'delnote') { D.notes = D.notes.filter(x => x.id !== m.note.id); save(); return renderMsgs(S.co, true); }
      if (v === 'again') { logMe(m.text); return runCommand(m.text); }
      if (v === 'dellog') { D.logs[here()] = arr(D.logs[here()]).filter(x => x.id !== m.id); save(); return renderMsgs(S.co, true); }
    },
    'convo-read': t => { D.seen['dm:' + t.dataset.key] = now(); save(); closeSheet(); renderAll(); },
    'convo-clear': t => { const c = convos().find(x => x.key === t.dataset.key); closeSheet(); if (c) c.items.filter(n => n.live).forEach(n => B.notifDismiss(n.id)); },
    compose: () => composeSheet(),
    fill: t => fill(t.dataset.v),
    torch: t => { const on = !S.torch; if (B.torch(on) !== false) { S.torch = on; t.classList.toggle('on', on); } },
    'reply-x': () => { S.reply = null; renderReplyBar(); },
    link: t => B.url(t.getAttribute('href'))
  };
  function onLong(t) {
    const k = t.dataset.long;
    if (k === 'app') return appSheet(t.dataset.key);
    if (k === 'space') return spaceSheet(t.dataset.id);
    if (k === 'msg') return msgSheet(t.dataset.mid);
    if (k === 'notif') return notifSheet(t.dataset.id);
    if (k === 'contact') return contactSheet(t.dataset.id);
    if (k === 'convo') return convoSheet(t.dataset.key);
  }

  /* ---------- input wiring: taps, long-press, swipes, pulls ---------- */
  function wire() {
    const app = $('#app'), chat = $('#chat'), people = $('#people'), views = $('#views');
    let lp = null, lastType = 'touch', dragEnd = 0, suppress = false;

    app.addEventListener('click', e => {
      if (suppress) { suppress = false; e.preventDefault(); e.stopPropagation(); return; }
      if (performance.now() - dragEnd < 350) { e.preventDefault(); return; }
      if (!S.wide && S.pos === 'people' && e.target.closest('#chat')) { e.preventDefault(); setPos('chat'); return; }
      const t = e.target.closest('[data-act]');
      if (!t || !app.contains(t)) return;
      const f = ACT[t.dataset.act];
      if (f) { e.preventDefault(); f(t, e); }
    }, true);

    app.addEventListener('pointerdown', e => {
      lastType = e.pointerType; suppress = false;
      if (S.wide) S.focus = e.target.closest('#chat,#people') ? 'chat' : e.target.closest('#views,#tabs,#nowbar') ? 'list' : S.focus;
      const t = e.target.closest('[data-long]');
      if (!t || (e.pointerType === 'mouse' && (!t.matches('.tile') || e.button !== 0))) return;
      lp = { t, x: e.clientX, y: e.clientY, timer: setTimeout(() => {
        suppress = true; if (B.haptic) B.haptic('long');
        if (t.matches('.tile[data-long="space"]') && startSort(t)) { lp = null; return; }
        lp = null; onLong(t);
      }, 460) };
    });
    const cancelLp = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
    app.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) cancelLp(); });
    app.addEventListener('pointerup', cancelLp);
    app.addEventListener('pointercancel', cancelLp);
    app.addEventListener('contextmenu', e => {
      const t = e.target.closest('[data-long]');
      if (e.target.closest('textarea,input')) return;
      e.preventDefault();
      if (t && lastType === 'mouse') onLong(t);
    });

    // Sideways swipes move the conversation layer between list, chat and drawer (folded screen only).
    // From Home, a short flick toward the left is enough to bring in #feed.
    let d = null;
    const W = () => app.clientWidth, PW = () => app.clientWidth * 0.84;
    const posX = p => (p === 'list' ? W() : p === 'people' ? -PW() : 0);
    app.addEventListener('pointerdown', e => {
      if (S.wide || (e.pointerType === 'mouse' && e.button !== 0) || S.sheet || S.ov || S.you || S.drag) return;
      if (e.target.closest('textarea,input,.picker,.favs,.seg,.nowbar,.tabs,.az')) return;
      let zone = null;
      if (e.target.closest('#chat') || (S.pos === 'people' && e.target.closest('#people'))) zone = 'chat';
      else if (S.pos === 'list' && S.tab === 'home' && e.target.closest('#v-home')) zone = 'home';
      if (!zone) return;
      d = { x0: e.clientX, y0: e.clientY, t0: performance.now(), base: posX(S.pos), on: false, id: e.pointerId, zone, x: posX(S.pos) };
    });
    app.addEventListener('pointermove', e => {
      if (!d || e.pointerId !== d.id) return;
      if (S.drag || (rb && rb.on)) { d = null; return; }
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!d.on) {
        if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx) * 1.3) { d = null; return; }
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy) * 0.9) return;
        if (d.zone === 'home' && dx > 0) { d = null; return; }
        if (d.base === -PW() && dx < 0) { d = null; return; }
        d.on = true; cancelLp(); unpress();
        if (d.zone === 'home') { if (S.ch !== 'home:feed') { S.ch = 'home:feed'; S.reply = null; } S.enterSeen = D.seen[S.ch] || 0; renderChat(); }
        chat.classList.add('drag');
        try { app.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      }
      d.x = Math.max(-PW(), Math.min(W(), d.base + dx));
      chat.style.transform = `translate3d(${d.x}px,0,0)`;
      people.classList.toggle('show', d.x < 0);
    });
    const end = e => {
      if (!d || e.pointerId !== d.id) return;
      const g = d; d = null;
      if (!g.on) return;
      dragEnd = performance.now();
      chat.classList.remove('drag'); chat.style.transform = '';
      const v = (g.x - g.base) / Math.max(1, performance.now() - g.t0);
      let target;
      if (g.base === W()) target = g.x < W() * 0.82 || v < -0.25 ? 'chat' : 'list';
      else if (g.base === 0) target = g.x > W() * 0.25 || v > 0.35 ? 'list' : g.x < -PW() * 0.25 || v < -0.35 ? 'people' : 'chat';
      else target = g.x > W() * 0.25 ? 'list' : g.x > -PW() * 0.62 || v > 0.35 ? 'chat' : 'people';
      if (target === 'chat' && g.base === W() && S.ch === 'home:feed') D.lastCh = 'home:feed';
      setPos(target);
      if (target === 'chat') setTimeout(() => { if (S.pos === 'chat') people.classList.remove('show'); }, 300);
    };
    app.addEventListener('pointerup', end);
    app.addEventListener('pointercancel', end);
    chat.addEventListener('transitionend', () => { if (!S.wide && S.pos !== 'people') people.classList.remove('show'); });

    // Floaty overscroll on every list. Past the top: #feed (or closes a sheet). Past the end of Home or a space: All apps.
    // Past the newest message in a conversation: back to the list. On the rail, past the top: the notification shade.
    const cue = $('#pullcue');
    const ACTS = {
      feed: { dir: 1, label: () => `${ic('hash', 'xs')}feed`, run: () => openFeedFromTop() },
      all: { dir: -1, label: () => `${ic('grid', 'xs')}All apps`, run: () => setSpace('all') },
      back: { dir: -1, label: () => `${ic('home', 'xs')}Back to the list`, run: () => closeChatUp() },
      shade: { dir: 1, label: () => `${ic('bell', 'xs')}Notifications`, run: () => B.shade() },
      sheet: { dir: 1, follow: '#sheet', run: () => closeSheet() },
      you: { dir: 1, follow: '#you', run: () => closeYou() }
    };
    function actFor(sc, dir) {
      if (sc.matches('.sheet-body')) return dir > 0 ? 'sheet' : null;
      if (sc.matches('.you-body')) return dir > 0 ? 'you' : null;
      if (sc.matches('.rail')) return dir > 0 ? 'shade' : null;
      if (sc.matches('#msgs')) return dir < 0 && !S.wide && S.pos === 'chat' ? 'back' : null;
      if (sc.matches('.chan-scroll')) return dir > 0 ? 'feed' : S.space !== 'all' ? 'all' : null;
      return dir > 0 ? 'feed' : null;   // Messages, Activity, overlays (adding apps to a space, settings…)
    }
    let rb = null;
    const damp = y => Math.sign(y) * 110 * (1 - Math.exp(-Math.abs(y) / 260));
    const atEnd = sc => sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2;
    app.addEventListener('touchstart', e => {
      rb = null;
      if (e.touches.length !== 1 || S.drag || S.azBusy || e.target.closest('textarea,input,.az,.picker,.favs,.qrpick')) return;
      const sc = e.target.closest('.chan-scroll,.page,.ov-body,#msgs,.sheet-body,.you-body,.rail');
      if (!sc || (sc.matches('#msgs') && !chatVisible())) return;
      if (sc.matches('.you-body') && e.target.closest('.you-dock')) return;
      const t = e.touches[0];
      rb = { sc, x0: t.clientX, y0: t.clientY, top: sc.scrollTop <= 0, end: atEnd(sc), on: false, dy: 0, ready: false, t0: performance.now() };
    }, { passive: true });
    app.addEventListener('touchmove', e => {
      if (!rb) return;
      if (S.drag) { rb = null; return; }
      const t = e.touches[0], dy = t.clientY - rb.y0, dx = t.clientX - rb.x0;
      if (!rb.on) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) { rb = null; return; }
        if (Math.abs(dy) < 6) return;
        const dir = dy > 0 ? 1 : -1;
        if (!((dir > 0 && rb.top && rb.sc.scrollTop <= 0) || (dir < 0 && rb.end && atEnd(rb.sc)))) { rb = null; return; }
        rb.on = true; rb.dir = dir; rb.y0 = t.clientY - dir * 6;
        rb.act = actFor(rb.sc, dir);
        const a = rb.act && ACTS[rb.act];
        rb.el = a && a.follow ? $(a.follow) : rb.sc;
        rb.el.classList.remove('springback'); rb.el.classList.add('drag');
        cancelLp(); unpress();
        if (a && a.label) {
          const r = rb.sc.getBoundingClientRect(), ar = app.getBoundingClientRect();
          cue.innerHTML = a.label();
          cue.style.top = (dir > 0 ? r.top - ar.top + 10 : r.bottom - ar.top - 44) + 'px';
          cue.classList.remove('ready');
        }
      }
      const raw = (t.clientY - rb.y0) * rb.dir;
      rb.dy = Math.max(0, raw);
      const a = rb.act && ACTS[rb.act];
      const off = a && a.follow ? rb.dy : damp(rb.dy);
      rb.el.style.transform = `translate3d(0,${rb.dir * off}px,0)`;
      const need = a && a.follow ? 110 : 84;
      const ready = !!a && rb.dy >= need;
      if (ready !== rb.ready) { rb.ready = ready; if (ready && B.haptic) B.haptic('tick'); cue.classList.toggle('ready', ready); }
      if (a && a.label) {
        const k = Math.min(1, rb.dy / need);
        cue.style.opacity = k;
        cue.style.transform = `translate(-50%,${rb.dir * (off * 0.5 - 6 + 6 * k)}px) scale(${0.85 + 0.15 * k})`;
      }
    }, { passive: true });
    const rbEnd = () => {
      if (!rb) return;
      const g = rb; rb = null;
      if (!g.on) return;
      const a = g.act && ACTS[g.act];
      const fast = a && a.follow && g.dy > 40 && g.dy / Math.max(1, performance.now() - g.t0) > 0.6;
      const go = a && (g.ready || fast);
      cue.style.opacity = 0; cue.style.transform = 'translate(-50%,0) scale(.85)';
      const el = g.el;
      el.classList.remove('drag');
      if (go && a.follow) { el.style.transform = ''; a.run(); return; }
      el.classList.add('springback'); el.style.transform = '';
      setTimeout(() => el.classList.remove('springback'), 560);
      if (go) { if (B.haptic) B.haptic('long'); setTimeout(a.run, g.act === 'all' ? 0 : 60); }
    };
    app.addEventListener('touchend', rbEnd, { passive: true });
    app.addEventListener('touchcancel', rbEnd, { passive: true });

    // Hold a space on the rail to lift it, drag it to a new spot, let go to drop it there. Hold and let go without moving: its options.
    const rail = $('#rail');
    function startSort(tile) {
      const tiles = [...rail.querySelectorAll('.tile[data-long="space"]')].filter(x => x.dataset.id !== 'home' && x.dataset.id !== 'all');
      const from = tiles.indexOf(tile);
      if (from < 0) return false;
      const rects = tiles.map(x => x.getBoundingClientRect());
      S.drag = { tile, tiles, rects, from, to: from, y0: lp ? lp.y : rects[from].top, moved: false, step: tiles.length > 1 ? rects[1].top - rects[0].top : 58 };
      rail.classList.add('sorting'); tile.classList.add('lifted');
      tile.style.transform = 'scale(1.12)';
      const ar = app.getBoundingClientRect(), hint = document.createElement('div');
      hint.className = 'sort-hint'; hint.textContent = 'Drag to reorder';
      hint.style.top = (rects[from].top - ar.top + 12) + 'px';
      app.appendChild(hint); S.drag.hint = hint;
      return true;
    }
    function moveSort(y) {
      const g = S.drag, dy = y - g.y0;
      if (Math.abs(dy) > 6 && !g.moved) { g.moved = true; if (g.hint) { g.hint.remove(); g.hint = null; } }
      const lo = g.rects[0].top - g.rects[g.from].top, hi = g.rects[g.rects.length - 1].top - g.rects[g.from].top;
      const off = Math.max(lo - 20, Math.min(hi + 20, dy));
      g.tile.style.transform = `translate3d(0,${off}px,0) scale(1.12)`;
      const to = Math.max(0, Math.min(g.tiles.length - 1, g.from + Math.round(off / g.step)));
      if (to !== g.to) { g.to = to; if (B.haptic) B.haptic('tick'); }
      g.tiles.forEach((x, i) => {
        if (x === g.tile) return;
        const shift = g.from < g.to && i > g.from && i <= g.to ? -g.step : g.to < g.from && i >= g.to && i < g.from ? g.step : 0;
        x.style.transform = shift ? `translate3d(0,${shift}px,0)` : '';
      });
    }
    function endSort(cancel) {
      const g = S.drag; if (!g) return;
      S.drag = null;
      if (g.hint) g.hint.remove();
      rail.classList.remove('sorting');
      g.tiles.forEach(x => { x.style.transform = ''; });
      g.tile.classList.remove('lifted');
      const id = g.tile.dataset.id;
      if (!g.moved) { renderRail(); if (!cancel) spaceSheet(id); return; }
      if (g.to !== g.from) {
        const [sp] = D.spaces.splice(g.from, 1); D.spaces.splice(g.to, 0, sp); save();
        if (B.haptic) B.haptic('long');
      }
      renderRail();
      const t = rail.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
      if (t && motionOK()) t.classList.add('settle');
      dragEnd = performance.now();
    }
    rail.addEventListener('touchmove', e => { if (S.drag && e.cancelable) e.preventDefault(); }, { passive: false });
    app.addEventListener('pointermove', e => { if (S.drag) moveSort(e.clientY); });
    app.addEventListener('pointerup', () => { if (S.drag) endSort(false); });
    app.addEventListener('pointercancel', () => { if (S.drag) endSort(!S.drag.moved); });

    // Pressing a row lights it up, the way a chat app does.
    let pressed = null, pressT = 0;
    const PRESS = '.chan,.convo,.nrow,.mrow,.ev,.row,.pp-row,.lk,.fav,.cmdrow';
    function unpress() { clearTimeout(pressT); if (pressed) { pressed.classList.remove('press'); pressed = null; } }
    app.addEventListener('pointerdown', e => {
      unpress();
      const t = e.target.closest(PRESS);
      if (!t || e.target.closest('input,textarea')) return;
      pressT = setTimeout(() => { pressed = t; t.classList.add('press'); }, e.pointerType === 'mouse' ? 0 : 45);
      t._px = e.clientX; t._py = e.clientY;
    });
    app.addEventListener('pointermove', e => { if (pressed && Math.hypot(e.clientX - pressed._px, e.clientY - pressed._py) > 9) unpress(); });
    app.addEventListener('pointerup', () => { clearTimeout(pressT); const p = pressed; pressed = null; if (p) setTimeout(() => p.classList.remove('press'), 140); });
    app.addEventListener('pointercancel', unpress);
    app.addEventListener('scroll', unpress, true);
    app.addEventListener('scroll', () => { if (app.scrollTop || app.scrollLeft) { app.scrollTop = 0; app.scrollLeft = 0; } });

    // Passport editor: typing goes into the draft
    $('#overlay').addEventListener('input', e => {
      const f = e.target.dataset && e.target.dataset.pp; if (!f || !S.ppDraft) return;
      if (f === 'link') { const l = S.ppDraft.links[+e.target.dataset.i]; if (l) l.v = e.target.value; }
      else S.ppDraft[f] = e.target.value;
    });

    // Composer
    const input = ta();
    $('#composer').addEventListener('submit', e => { e.preventDefault(); onSend(); });
    input.addEventListener('input', () => { autosize(); updatePicker(); });
    input.addEventListener('keydown', e => {
      const open = !$('#picker').hidden && S.pick.items.length;
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); onSend(); return; }
      if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        S.pick.i = (S.pick.i + (e.key === 'ArrowDown' ? 1 : -1) + S.pick.items.length) % S.pick.items.length;
        renderPicker(); return;
      }
      if (open && e.key === 'Tab') { e.preventDefault(); const it = S.pick.items[S.pick.i]; if (it && it.fill != null) { setInput(it.fill); updatePicker(); } return; }
      if (e.key === 'Escape') { e.preventDefault(); if (open) hidePicker(); else if (S.reply) { S.reply = null; renderReplyBar(); } else input.blur(); return; }
      if (!input.value && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && D.hist.length) {
        e.preventDefault();
        S.hi = e.key === 'ArrowUp' ? (S.hi < 0 ? D.hist.length - 1 : Math.max(0, S.hi - 1)) : -1;
        if (S.hi >= 0) { setInput(D.hist[S.hi]); updatePicker(); }
      }
    });
    input.addEventListener('beforeinput', e => { if (e.inputType === 'insertLineBreak') { e.preventDefault(); onSend(); } });
    for (const el of [$('#picker'), $('#send'), $('.slash')]) el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || el.id !== 'picker') e.preventDefault(); });
    $('#picker').addEventListener('mousedown', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !(e.target.closest && e.target.closest('textarea,input'))) back();
      if (e.key === '/' && e.target === document.body) { e.preventDefault(); fill('/'); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !NATIVE) { checkReminders(); renderAll(); } });
    let rT = 0;
    window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => applyWide(), 60); });
  }

  /* ---------- native events ---------- */
  let refreshT = 0;
  function refreshSoon() {
    clearTimeout(refreshT);
    refreshT = setTimeout(() => {
      renderRail(); renderList(); renderTabs(); renderNow();
      if (S.tab !== 'home') renderPage();
      if (chatVisible()) { S.co = chanObj(S.ch); renderMsgs(S.co, true); renderPeople(S.co); renderChatHead(S.co); if (S.pos === 'chat' || (S.wide && S.focus === 'chat')) markSeen(); }
    }, 90);
  }
  window.SB = {
    toast,
    onNative(type, data) {
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { /* keep string */ } }
      switch (type) {
        case 'back': back(); break;
        case 'home': goHome(); break;
        case 'apps': loadApps(); refreshSoon(); break;
        case 'notifs': loadNotifs(Array.isArray(data) ? data : undefined); refreshSoon(); break;
        case 'media': S.media = data && data.title ? data : null; renderNow(); break;
        case 'battery': S.battery = data || S.battery; if (S.you) renderYou(); if (S.tab === 'home') renderList(); break;
        case 'perms': S.perms = (data && typeof data === 'object') ? data : (B.perms() || {}); loadAll(); refreshSoon(); break;
        case 'events': S.events = arr(data); refreshSoon(); break;
        case 'remind': checkReminders(); break;
        case 'resume': loadAll(); maybeBrief(); checkReminders(); refreshSoon(); break;
      }
    }
  };

  /* ---------- start ---------- */
  function init() {
    applySkin();
    loadAll();
    initPassport();
    if (S.space !== 'home' && S.space !== 'all' && !spaceOf(S.space)) S.space = 'home';
    S.ch = chanObj(D.lastCh || 'home:feed').id;
    wire();
    maybeBrief();
    checkReminders();
    renderChat();
    applyWide(true);
    if (!S.wide) setPos('list');
    renderAll();
    setInterval(() => { if (document.hidden) return; checkReminders(); renderTabs(); if (S.tab === 'home') renderList(); else renderPage(); }, 30000);
  }
  init();
})();

</script>

</body></html>
